name: 每日更新

on:
  schedule:
    # UTC 10:30 = 台北 18:30，週一到週五。收盤後檔案才會上架。
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tw-cb-data-fetch
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓當月缺的檔
        env:
          SLEEP_TPEX: "1.5"
        run: python -u scripts/tpex_cb.py daily

      - name: 提交結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "今天沒有新資料（可能是休市日）"
          else
            git commit -m "每日更新 $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
